# USB CDC ACM console (so the module UART on uart0 is free for AT commands)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_CONSOLE=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_UDC_BUF_COUNT=32

# RTT log backend (so the test can be monitored via J-Link RTT)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
# DROP (not block) the RTT backend when full: blocking busy-waits and a context
# switch during that wait can fault when no host is draining RTT yet.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# UART driver for the module link
CONFIG_UART_INTERRUPT_DRIVEN=y

# Argos SMD UART driver
CONFIG_ARGOS_SMD=y
CONFIG_ARGOS_SMD_LOG_LEVEL_DBG=y

# GPIO for the wake-up line
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=4096
