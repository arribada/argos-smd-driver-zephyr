# Argos SMD driver with SPI transport
CONFIG_ARGOS_SMD=y
CONFIG_ARGOS_SMD_SPI=y

# SPI + GPIO (wake line)
CONFIG_SPI=y
CONFIG_GPIO=y

# Logging (INF: the per-transaction TX/RX DBG logs would flood RTT)
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ARGOS_SMD_LOG_LEVEL_INF=y

# RTT console
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# RTT log backend must DROP (not block) when full, otherwise immediate logging
# busy-waits while no RTT host is draining and a context switch during that wait
# can fault.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384

CONFIG_MAIN_STACK_SIZE=4096
